services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ideas
      POSTGRES_USER: ideas
      POSTGRES_PASSWORD: ideas-local-only
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ideas -d ideas"]
      interval: 5s
      timeout: 3s
      retries: 10
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    command: ["redis-server", "--appendonly", "yes"]
volumes:
  pgdata:
