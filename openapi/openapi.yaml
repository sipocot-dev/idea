openapi: 3.0.3
info:
  title: BetterSipocot Ideas API
  version: 1.0.0
  description: Public proposal discovery API.
servers:
  - url: https://ideas.bettersipocot.org/api/v1
paths:
  /ideas:
    get:
      summary: List public proposals
      parameters:
        - in: query
          name: q
          schema:
            type: string
            maxLength: 100
          description: Search proposal titles.
      responses:
        "200":
          description: Public proposals
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        slug: { type: string }
                        title: { type: string }
                        summary: { type: string }
                        type: { type: string }
                        status: { type: string }
                        createdAt: { type: string, format: date-time }
